<!DOCTYPE html>
<html lang="zh-TW" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子郵件驗證 - IFDCS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,100,0,0"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'primary': ['JetBrains Mono', 'monospace'],
                        'secondary': ['Geist', 'sans-serif'],
                    },
                    colors: {
                        'background': '#F2F3F0',
                        'foreground': '#111111',
                        'card': '#FFFFFF',
                        'border': '#CBCCC9',
                        'primary': '#FF8400',
                        'success': '#DFE6E1',
                        'success-foreground': '#004D1A',
                        'error': '#E5DCDA',
                        'error-foreground': '#8C1C00',
                    }
                }
            }
        }
    </script>
</head>

<body class="h-full bg-background font-secondary flex items-center justify-center p-6">
    <div class="w-full max-w-[480px] bg-card border border-border rounded-[32px] p-10 shadow-xl text-center space-y-6">
        <div id="loading" class="space-y-4">
            <div class="inline-block w-12 h-12 border-4 border-primary/20 border-t-primary rounded-full animate-spin">
            </div>
            <p class="text-muted-foreground">正在驗證您的帳號...</p>
        </div>

        <div id="success" class="hidden space-y-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-success rounded-full">
                <span class="material-symbols-sharp text-4xl text-success-foreground">check_circle</span>
            </div>
            <div class="space-y-2">
                <h1 class="text-2xl font-bold text-foreground">驗證成功！</h1>
                <p class="text-muted-foreground">您的帳號已成功啟動，現在可以開始使用系統。</p>
            </div>
            <a href="login.html"
                class="block w-full h-14 bg-primary text-foreground rounded-2xl font-bold flex items-center justify-center shadow-lg shadow-primary/20">
                立即登入
            </a>
        </div>

        <div id="error" class="hidden space-y-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-error rounded-full">
                <span class="material-symbols-sharp text-4xl text-error-foreground">error</span>
            </div>
            <div class="space-y-2">
                <h1 class="text-2xl font-bold text-foreground">驗證失敗</h1>
                <p id="error-message" class="text-muted-foreground">連結可能已失效或過期。</p>
            </div>
            <a href="register.html"
                class="block w-full h-14 border border-border text-foreground rounded-2xl font-bold flex items-center justify-center">
                回登入頁面
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function verifyEmail() {
            if (!token) {
                showStatus('error', '無效的驗證 Token');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3001/api/auth/verify-email?token=${token}`);
                const data = await response.json();

                if (response.ok) {
                    showStatus('success');
                } else {
                    showStatus('error', data.message);
                }
            } catch (err) {
                showStatus('error', '連線至伺服器時發生錯誤');
            }
        }

        function showStatus(type, message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById(type).classList.remove('hidden');
            if (message) document.getElementById('error-message').textContent = message;
        }

        verifyEmail();
    </script>
</body>

</html>
