<!DOCTYPE html>
<html lang="zh-TW" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼 - IFDCS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,100,0,0"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'primary': ['JetBrains Mono', 'monospace'],
                        'secondary': ['Geist', 'sans-serif'],
                    },
                    colors: {
                        'background': '#F2F3F0',
                        'foreground': '#111111',
                        'card': '#FFFFFF',
                        'border': '#CBCCC9',
                        'primary': '#FF8400',
                    }
                }
            }
        }
    </script>
</head>

<body class="h-full bg-background font-secondary flex items-center justify-center p-6">
    <div class="w-full max-w-[480px] bg-card border border-border rounded-[32px] p-10 shadow-xl space-y-8">
        <div class="text-center space-y-4">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-2xl">
                <span class="material-symbols-sharp text-3xl text-foreground">lock_reset</span>
            </div>
            <h1 class="text-2xl font-bold text-foreground">設定新密碼</h1>
            <p class="text-muted-foreground">請輸入您的新密碼以完成重設流程。</p>
        </div>

        <form id="reset-form" class="space-y-6">
            <div class="space-y-2">
                <label for="password" class="text-sm font-medium text-foreground ml-1">新密碼 / New Password</label>
                <div class="relative">
                    <span
                        class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-sharp text-muted-foreground">lock</span>
                    <input type="password" id="password" required
                        class="w-full h-14 pl-12 pr-4 bg-muted/50 border border-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-base"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="space-y-2">
                <label for="confirm-password" class="text-sm font-medium text-foreground ml-1">確認新密碼 / Confirm New
                    Password</label>
                <div class="relative">
                    <span
                        class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-sharp text-muted-foreground">verified_user</span>
                    <input type="password" id="confirm-password" required
                        class="w-full h-14 pl-12 pr-4 bg-muted/50 border border-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-base"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit"
                class="w-full h-14 bg-primary text-foreground rounded-2xl font-bold text-lg hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary/20">
                更新密碼
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                alert('兩次輸入的密碼不一致');
                return;
            }

            if (!token) {
                alert('無效的重設 Token');
                return;
            }

            try {
                const response = await fetch('http://localhost:3001/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('密碼重設成功，請使用新密碼登入。');
                    window.location.href = 'login.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('連線至伺服器時發生錯誤');
            }
        });
    </script>
</body>

</html>
